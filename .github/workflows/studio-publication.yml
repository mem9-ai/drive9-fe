name: Trusted Studio publication validation

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  # `pull_request_review` is deliberately absent: GitHub runs that event with the
  # workflow file from the pull request head, and this workflow issues the
  # required check, so a candidate could register a passing check on itself.
  # After an approval, re-run this workflow (or push) to turn the check green.

permissions:
  contents: read
  checks: write
  # Required to read the PR's reviews for the build-surface approval gate.
  pull-requests: read

concurrency:
  group: studio-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate with trusted main
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never check out or execute candidate code in this workflow: the base
      # commit is explicit, never `github.sha`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Register the required check on the immutable candidate head
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='Studio artifact' -f head_sha="$HEAD_SHA" -f status=in_progress \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Fetch the candidate head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$HEAD_SHA"
      - name: Require a maintainer approval for build-surface changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Author identity as GitHub reports it, never the sender and never a
          # branch name. `user.type` alone is too coarse — every installed GitHub
          # App authors as `Bot` — so the exemption also pins the publisher app's
          # login, and still requires every changed path to be the artifact.
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          # Netlify executes this surface from the merged revision, so a change to
          # it changes code execution in the deploy environment. Every decision
          # lives in scripts/publication-approval.mjs (`gate`): this step only
          # fetches GitHub's objects, retries a listing that is not trustworthy
          # yet, and forwards the exit status. 0 = pass, 1 = approval required,
          # 3 = retry, anything else = fail closed.
          status=1
          for attempt in 1 2; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/files.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull.json"
            # Fetched on every attempt so one gate call sees one consistent set of
            # inputs: a content-only PR now depends on this third read succeeding,
            # which fails closed and is recovered by the attempt loop.
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" > "$RUNNER_TEMP/reviews.json"
            set +e
            node scripts/publication-approval.mjs gate \
              --files "$RUNNER_TEMP/files.json" --pull "$RUNNER_TEMP/pull.json" \
              --reviews "$RUNNER_TEMP/reviews.json" --head "$HEAD_SHA" \
              --author-type "$PR_AUTHOR_TYPE" --author-login "$PR_AUTHOR_LOGIN" \
              --paths-out "$RUNNER_TEMP/changed-paths.txt"
            status=$?
            set -e
            if [ "$status" -ne 3 ]; then
              exit "$status"
            fi
            echo "Changed-file listing not verifiable yet (attempt $attempt); retrying." >&2
            sleep 3
          done
          exit "$status"
      - name: Validate candidate data with trusted code
        id: validate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Artifact-only validation uses the same identity story as the approval
          # exemption: the publisher app itself, plus the branch name the
          # publisher uses (a candidate picking that name only makes validation
          # stricter). `sender` is deliberately not consulted.
          ARTIFACT_ONLY: ${{ github.event.pull_request.user.login == 'mem9-studio-publisher[bot]' || github.head_ref == 'automation/studio-console' }}
        run: node scripts/validate-studio-publication.mjs "$HEAD_SHA" "$ARTIFACT_ONLY" "$RUNNER_TEMP/changed-paths.txt"
      - name: Report the required result on that same head
        if: always() && steps.check.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          CONCLUSION: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" \
            -f status=completed -f conclusion="$CONCLUSION" > /dev/null
