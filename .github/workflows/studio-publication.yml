name: Trusted Studio publication validation

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Submitting a review re-runs the trusted validation, so a maintainer
  # approval turns the required check green without a manual re-run.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  checks: write
  # Required to read the PR's reviews for the build-surface approval gate.
  pull-requests: read

concurrency:
  group: studio-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate with trusted main
    # pull_request_review does not honour the branch filter above.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never check out or execute candidate code in this workflow. `github.sha`
      # is the PR head for pull_request_review, so the base commit is explicit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Register the required check on the immutable candidate head
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='Studio artifact' -f head_sha="$HEAD_SHA" -f status=in_progress \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Fetch the candidate head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$HEAD_SHA"
      - name: Require a maintainer approval for build-surface changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Netlify executes this surface from the merged revision, so a change
          # to it changes code execution in the deploy environment. The list
          # lives in scripts/build-surface.mjs (single source). GitHub's pull
          # request file list is computed against the merge base, so an
          # advancing main cannot make an unrelated PR look like a change.
          # The endpoint is documented to cap at 3000 files without an error, so
          # compare the listing with the PR's own count and fail closed if the
          # list may be incomplete.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/files.json"
          listed=$(jq 'flatten | length' "$RUNNER_TEMP/files.json")
          reported=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')
          if [ "$listed" != "$reported" ]; then
            echo "Cannot verify every changed file ($listed listed, $reported reported); refusing to evaluate the build surface." >&2
            exit 1
          fi
          # A rename reports the new name only, so include the previous name too.
          jq -r 'flatten | .[] | .filename, (.previous_filename // empty)' "$RUNNER_TEMP/files.json" > "$RUNNER_TEMP/changed-paths.txt"
          changed=$(node scripts/build-surface.mjs --stdin < "$RUNNER_TEMP/changed-paths.txt")
          if [ "$changed" = "Build surface unchanged." ]; then
            echo "$changed"
            exit 0
          fi
          echo "Build surface changed:"
          echo "$changed"
          # Only an approval of this exact head counts, and only the reviewer's
          # latest state-carrying review: a stale approval cannot be reused after
          # a follow-up push, and an ordinary comment after an approval does not
          # revoke it (GitHub keeps the approval in that case too).
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" > "$RUNNER_TEMP/reviews.json"
          approved=$(jq -r --arg head "$HEAD_SHA" '
            flatten
            | map(select(.user != null))
            | group_by(.user.login)
            | map(map(select(.state != "COMMENTED")) | sort_by(.submitted_at) | last)
            | map(select(. != null
                         and .state == "APPROVED"
                         and .commit_id == $head
                         and (.author_association == "OWNER"
                              or .author_association == "MEMBER"
                              or .author_association == "COLLABORATOR")))
            | .[].user.login' "$RUNNER_TEMP/reviews.json")
          if [ -z "$approved" ]; then
            echo 'Build-surface change needs an approving review from a maintainer on this exact head.' >&2
            exit 1
          fi
          echo "Build-surface change approved by: $(echo "$approved" | tr '\n' ' ')"
      - name: Validate candidate data with trusted code
        id: validate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          # `sender` is the review submitter under pull_request_review, so a bot
          # review would otherwise force artifact-only validation on human PRs.
          ARTIFACT_ONLY: ${{ github.event.pull_request.user.type == 'Bot' || github.head_ref == 'automation/studio-console' }}
        run: node scripts/validate-studio-publication.mjs "$PR_BASE" "$HEAD_SHA" "$ARTIFACT_ONLY" "$RUNNER_TEMP/changed-paths.txt"
      - name: Report the required result on that same head
        if: always() && steps.check.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          CONCLUSION: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" \
            -f status=completed -f conclusion="$CONCLUSION" > /dev/null
