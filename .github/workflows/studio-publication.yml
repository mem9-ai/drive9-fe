name: Trusted Studio publication validation

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  # `pull_request_review` is deliberately absent: GitHub runs that event with the
  # workflow file from the pull request head, and this workflow issues the
  # required check, so a candidate could register a passing check on itself.
  # After an approval, re-run this workflow (or push) to turn the check green.

permissions:
  contents: read
  checks: write
  # Required to read the PR's reviews for the build-surface approval gate.
  pull-requests: read

concurrency:
  group: studio-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate with trusted main
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never check out or execute candidate code in this workflow: the base
      # commit is explicit, never `github.sha`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Register the required check on the immutable candidate head
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='Studio artifact' -f head_sha="$HEAD_SHA" -f status=in_progress \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Fetch the candidate head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$HEAD_SHA"
      - name: Require a maintainer approval for build-surface changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Author type, never the sender and never a branch name: only the
          # Console publisher app can be `Bot`, and the exemption below still
          # requires every changed path to be the artifact.
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          # Netlify executes this surface from the merged revision, so a change
          # to it changes code execution in the deploy environment. The decision
          # logic lives in scripts/publication-approval.mjs and
          # scripts/build-surface.mjs so it is covered by tests.
          verified=0
          for attempt in 1 2; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/files.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull.json"
            if node scripts/publication-approval.mjs changed-paths \
              --files "$RUNNER_TEMP/files.json" --pull "$RUNNER_TEMP/pull.json" --head "$HEAD_SHA" \
              > "$RUNNER_TEMP/changed-paths.txt"; then
              verified=1
              break
            fi
            echo "Changed-file listing not verifiable yet (attempt $attempt); retrying." >&2
            sleep 3
          done
          if [ "$verified" != 1 ]; then
            echo "Refusing to evaluate the build surface: the changed-file list is incomplete or stale." >&2
            exit 1
          fi
          changed=$(node scripts/build-surface.mjs --stdin < "$RUNNER_TEMP/changed-paths.txt")
          case "$changed" in
            "Build surface unchanged.")
              echo "$changed"
              exit 0
              ;;
            "")
              echo "Build-surface evaluation produced no output; failing closed." >&2
              exit 1
              ;;
          esac
          echo "Build surface changed:"
          echo "$changed"
          # The Console publisher app ships artifact-only releases; those keep
          # merging without a human, exactly as they did before this gate
          # covered them. Anything else needs a maintainer approval.
          if node scripts/publication-approval.mjs bot-artifact \
            --paths "$RUNNER_TEMP/changed-paths.txt" --author-type "$PR_AUTHOR_TYPE"; then
            exit 0
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" > "$RUNNER_TEMP/reviews.json"
          node scripts/publication-approval.mjs approvals \
            --reviews "$RUNNER_TEMP/reviews.json" --head "$HEAD_SHA"
      - name: Validate candidate data with trusted code
        id: validate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          # Bot-authored PRs are artifact-only. `sender` is deliberately not
          # consulted: with a review trigger it is the reviewer, not the author,
          # so a bot review would force artifact-only validation on human PRs.
          ARTIFACT_ONLY: ${{ github.event.pull_request.user.type == 'Bot' || github.head_ref == 'automation/studio-console' }}
        run: node scripts/validate-studio-publication.mjs "$HEAD_SHA" "$ARTIFACT_ONLY" "$RUNNER_TEMP/changed-paths.txt"
      - name: Report the required result on that same head
        if: always() && steps.check.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          CONCLUSION: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" \
            -f status=completed -f conclusion="$CONCLUSION" > /dev/null
