# The Netlify project's base directory is `site`.
# Build commands and the publish directory are relative to that directory.

[build]
  ignore = "node ./../scripts/netlify-ignore.mjs"
  command = "node --test ../scripts/*.test.mjs && node ../scripts/prepare-studio.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "24.22.1"
  NPM_VERSION = "11.6.2"

[[headers]]
  for = "/studio/config.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/studio/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Preserve installed CLIs and old download links. Force bypasses checked-in
# site/releases files so metadata and binaries all come from the same origin.
[[redirects]]
  from = "/releases/*"
  to = "https://releases.drive9.ai/latest/:splat"
  status = 302
  force = true

# The Console and Admin are private application surfaces. Public discovery has its
# own initial HTML and production-only index policy from prepare-studio.mjs.
[[headers]]
  for = "/studio/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/studio/api/*"
  [headers.values]
    Cache-Control = "no-store"
